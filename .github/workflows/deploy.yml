name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build and deploy OpenNext Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7f12ac00155d703a5ef37e77741ecaf2
          WORDPRESS_API_URL: https://cms.jelapangresources.com/wp-json
          NEXT_PUBLIC_WORDPRESS_API_URL: https://cms.jelapangresources.com/wp-json
