name: Deploy to Vercel

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  WORDPRESS_API_URL: https://cms.jelapangresources.com/wp-json
  NEXT_PUBLIC_WORDPRESS_API_URL: https://cms.jelapangresources.com/wp-json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Set Vercel target
        id: target
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "vercel_env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Sync revalidate secret to Vercel
        if: ${{ secrets.REVALIDATE_SECRET != '' }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          printf '%s' "$REVALIDATE_SECRET" | vercel env add REVALIDATE_SECRET production --force --token=${{ secrets.VERCEL_TOKEN }}
          printf '%s' "$REVALIDATE_SECRET" | vercel env add REVALIDATE_SECRET preview --force --token=${{ secrets.VERCEL_TOKEN }}
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.vercel_env }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Inject revalidate secret for deploy
        if: ${{ secrets.REVALIDATE_SECRET != '' }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          VERCEL_ENV: ${{ steps.target.outputs.vercel_env }}
        run: echo "REVALIDATE_SECRET=$REVALIDATE_SECRET" >> ".vercel/.env.${VERCEL_ENV}.local"
      - name: Deploy
        run: vercel deploy --yes ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}
